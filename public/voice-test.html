<!doctype html>
<html lang="ko">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>목소리 진단</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; line-height: 1.6; }
  h1 { font-size: 22px; }
  #summary { font-weight: bold; padding: 10px 14px; background: #f1f5f9; border-radius: 12px; }
  button { display: block; width: 100%; margin: 6px 0; padding: 12px 14px; font-size: 15px; font-weight: bold;
           border: 2px solid #e2e8f0; border-radius: 12px; background: #fff; text-align: left; cursor: pointer; }
  button:hover { background: #f8fafc; }
  .preset { border-color: #f43f5e; }
  .muted { color: #94a3b8; font-size: 13px; }
  h2 { font-size: 16px; margin-top: 28px; }
</style>

<h1>🔊 이 브라우저의 목소리 진단</h1>
<p id="summary">읽는 중…</p>

<h2>1) 설치된 한국어 음성 — 하나씩 눌러 들어보세요</h2>
<p class="muted">여기 버튼들이 서로 다르게 들리면 앱도 다르게 낼 수 있습니다.
전부 같게 들리면 이 브라우저의 한계입니다.</p>
<div id="list">…</div>

<h2>2) 앱 프리셋 4개 — 실제 배정 결과</h2>
<p class="muted">앱과 같은 방식으로 음성·높낮이를 배정해 재생합니다.</p>
<div id="presets"></div>

<script>
  const SAMPLE = "안녕하세요! 오늘은 어떤 동화를 읽어볼까요?";
  const PRESETS = [
    { id: "basic", name: "또랑또랑 🎈", pitch: 1.0, rate: 0.9, text: "안녕! 오늘은 어떤 동화를 읽어볼까?" },
    { id: "chick", name: "삐약이 🐥", pitch: 1.6, rate: 1.0, text: "삐약삐약! 나랑 같이 동화 보러 가자!" },
    { id: "bear", name: "곰아저씨 🐻", pitch: 0.6, rate: 0.82, text: "허허, 오늘은 아주 재미있는 이야기를 들려주마." },
    { id: "fairy", name: "요정님 🧚", pitch: 1.3, rate: 1.1, text: "반짝반짝! 마법 같은 이야기가 시작돼요!" },
  ];
  const MALE = /injoon|hyunsu|gookmin|bongjin|minsu|male|-kod/i;

  function koVoices() {
    return speechSynthesis.getVoices()
      .filter(v => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith("ko"));
  }

  function assign(presetId) {
    const voices = koVoices();
    if (voices.length === 0) return null;
    if (voices.length === 1) return voices[0];
    const males = voices.filter(v => MALE.test(v.name));
    const others = voices.filter(v => !MALE.test(v.name));
    if (presetId === "bear" && males.length) return males[0];
    const pool = others.length ? others : voices;
    const idx = Math.max(0, PRESETS.findIndex(p => p.id === presetId));
    return pool[idx % pool.length];
  }

  function effectivePitch(p) {
    if (koVoices().length > 1) return p.pitch;
    return Math.min(2, Math.max(0.1, (p.pitch - 1) * 1.8 + 1));
  }

  function speak(text, voice, pitch, rate) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR";
    if (voice) u.voice = voice;
    if (pitch) u.pitch = pitch;
    if (rate) u.rate = rate;
    speechSynthesis.speak(u);
  }

  function render() {
    const all = speechSynthesis.getVoices();
    const ko = koVoices();
    document.getElementById("summary").textContent =
      "전체 음성 " + all.length + "개, 그중 한국어 " + ko.length + "개";

    const list = document.getElementById("list");
    list.innerHTML = "";
    if (ko.length === 0) {
      list.textContent = "한국어 음성이 없습니다 (또는 아직 로드 중 — 잠시 후 자동 갱신).";
    }
    for (const v of ko) {
      const b = document.createElement("button");
      b.textContent = "▶ " + v.name + " — " + v.lang + " · " + (v.localService ? "로컬" : "온라인");
      b.onclick = () => speak(SAMPLE, v);
      list.appendChild(b);
    }

    const pr = document.getElementById("presets");
    pr.innerHTML = "";
    for (const p of PRESETS) {
      const v = assign(p.id);
      const b = document.createElement("button");
      b.className = "preset";
      b.textContent = "▶ " + p.name + " → " + (v ? v.name : "(브라우저 기본)") +
        " · pitch " + effectivePitch(p).toFixed(1);
      b.onclick = () => speak(p.text, v, effectivePitch(p), p.rate);
      pr.appendChild(b);
    }
  }

  render();
  speechSynthesis.onvoiceschanged = render;
</script>
</html>
